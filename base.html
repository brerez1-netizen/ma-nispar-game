<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><title>בסיס לתמונה</title>
<style>html,body{margin:0;background:#f7f3ea}svg{display:block;width:1024px;height:1024px}</style></head>
<body>
<script src="js/flat.js"></script>
<script>
// שכבת הבסיס בלבד, בלי סימון ובלי כיתוב. זו התמונה שנשלחת למודל.
document.body.insertAdjacentHTML('beforeend',
  '<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">' +
  '<rect x="0" y="0" width="1024" height="1024" fill="#f7f3ea"/>' +
  window.flat.baseLayer() + '</svg>');
</script>
</body></html>
